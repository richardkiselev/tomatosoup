<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://trmnl.com/css/latest/plugins.css">
  <script src="https://trmnl.com/js/latest/plugins.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <style>
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 3rem;
      text-align: center;
      margin: 1rem 0;
    }
  </style>
</head>
<body class="environment trmnl">
  <div class="screen">
    <div class="view view--full">
      <div class="layout">
        <div class="columns">
          <div class="column">
            <div class="markdown">
              <h1>The time is XX:XX.</h1>
              <h1>There will be a C train at your stop in YY minutes.</h1>
              <h1>To catch the train, you will need to leave in ZZ minutes.</h1>
            </div>
          </div>
        </div>
      </div>

      <div class="title_bar">
        <img class="image" src="https://trmnl.com/images/plugins/trmnl--render.svg">
        <span class="title">Subway Clock 1.0 | R. Kiselev</span>
      </div>
    </div>
  </div>
</body>
</html>
